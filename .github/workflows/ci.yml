name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm size

  # The UI kit in a real browser: the same page in React, Vue and Angular must look the same
  # (pixel comparison between them) and pass axe, colour contrast included.
  e2e-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @omnifront/e2e-ui build:examples
      - run: pnpm --filter @omnifront/e2e-ui exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @omnifront/e2e-ui e2e
