<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d">
<title id="t">One core, four frameworks</title>
<desc id="d">A query update leaves the omnifront core and reaches the React, Next.js, Vue and Angular adapters at the same time.</desc>
<style>
	text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
	.src { animation: src 6s infinite; }
	.flash { opacity: 0; animation: flash 6s infinite; }
	.v2 { animation: v2 6s infinite; }
	.v3 { opacity: 0; animation: v3 6s infinite; }
	@keyframes src { 0%, 14% { stroke: #334155; } 3%, 9% { stroke: #7C3AED; } }
	@keyframes flash { 0%, 44% { opacity: 0; } 47% { opacity: 1; } 62%, 100% { opacity: 0; } }
	@keyframes v2 { 0%, 45% { opacity: 1; } 47%, 93% { opacity: 0; } 96%, 100% { opacity: 1; } }
	@keyframes v3 { 0%, 45% { opacity: 0; } 47%, 93% { opacity: 1; } 96%, 100% { opacity: 0; } }
	@media (prefers-reduced-motion: reduce) {
		.pulse { display: none; }
		.src, .flash { animation: none; }
		.v2 { animation: none; opacity: 0; }
		.v3 { animation: none; opacity: 1; }
	}
</style>
