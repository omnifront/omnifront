server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;

	# VitePress "clean URLs": /guide/queries -> guide/queries.html
	# Pages (everything but /assets/) are revalidated on every visit; they link to hashed assets.
	location / {
		try_files $uri $uri.html $uri/ =404;
		add_header Cache-Control "no-cache";
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy strict-origin-when-cross-origin always;
	}

	# Hashed build output never changes; cache it hard.
	# (add_header in a location replaces the server-level ones, so the security headers repeat here.)
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options nosniff always;
	}

	error_page 404 /404.html;
}
